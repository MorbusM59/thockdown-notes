<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>CM6 spike</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1e1e1e; }
  .cm-editor { height: 100vh; font-family: monospace; font-size: 15px; }
  .cm-scroller { overflow: auto; }
  /* Rough visual mirror of the app's line-token classes -- fidelity doesn't
     matter for a cost measurement, only that the decoration computation
     itself runs, matching SyntaxHighlightPlugin.tsx's real classifier. */
  .tk-heading { color: #dcdcaa; font-weight: bold; }
  .tk-code-fence { color: #6a9955; }
  .tk-blockquote { color: #9cdcfe; font-style: italic; }
  .tk-list { color: #ce9178; }
  .tk-table-row, .tk-table-divider { color: #c586c0; }
  .tk-thematic-break { color: #808080; }
</style>
</head>
<body>
<div id="editor"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
