apply plugin: 'com.android.application'

def soundscapesVersion = new groovy.json.JsonSlurper()
        .parse(rootProject.file('../package.json')).version as String
def soundscapesVersionParts = soundscapesVersion.tokenize('.')*.toInteger()
if (soundscapesVersionParts.size() != 3 || soundscapesVersionParts[1] > 99 || soundscapesVersionParts[2] > 99) {
    throw new GradleException("apps/soundscapes/package.json version must be MAJOR.MINOR.PATCH with MINOR and PATCH below 100, got ${soundscapesVersion}")
}
def soundscapesVersionCode = soundscapesVersionParts[0] * 10000 + soundscapesVersionParts[1] * 100 + soundscapesVersionParts[2]

android {
    namespace = "com.thockdown.soundscapes"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.thockdown.soundscapes"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // The app's version is the one in apps/soundscapes/package.json, for every
        // build (debug, release, local). The versionCode is derived from it
        // (major x 10000 + minor x 100 + patch), so it is reproducible from the
        // commit and rises with every version: a Play upload must carry a
        // higher versionCode than every upload before it, so a new upload
        // needs a new version.
        versionCode soundscapesVersionCode
        versionName soundscapesVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // CI signs every build with ONE key (the ANDROID_KEYSTORE_* repository
    // secrets, see .github/workflows/ci.yml): Android installs an update only when
    // its signature matches the installed app's, and the debug key a fresh
    // runner generates differs every time. A local build without the
    // variables keeps the machine's own debug key.
    signingConfigs {
        if (System.getenv("SOUNDSCAPES_KEYSTORE")) {
            shared {
                storeFile file(System.getenv("SOUNDSCAPES_KEYSTORE"))
                storeType "pkcs12"
                storePassword System.getenv("SOUNDSCAPES_KEYSTORE_PASSWORD")
                keyAlias "soundscapes"
                keyPassword System.getenv("SOUNDSCAPES_KEYSTORE_PASSWORD")
            }
        }
        // The Play UPLOAD key (PLAY_UPLOAD_* repository secrets,
        // release-android.yml): what Google checks an upload against before
        // re-signing the app with its own key. Separate from the key above,
        // which signs the sideloaded debug builds.
        if (System.getenv("PLAY_UPLOAD_KEYSTORE")) {
            upload {
                storeFile file(System.getenv("PLAY_UPLOAD_KEYSTORE"))
                storeType "pkcs12"
                storePassword System.getenv("PLAY_UPLOAD_KEYSTORE_PASSWORD")
                keyAlias "upload"
                keyPassword System.getenv("PLAY_UPLOAD_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv("SOUNDSCAPES_KEYSTORE")) signingConfig signingConfigs.shared
        }
        release {
            if (System.getenv("PLAY_UPLOAD_KEYSTORE")) signingConfig signingConfigs.upload
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Runs the soundscape renderer outside the WebView (SoundscapeRenderer).
    implementation "androidx.javascriptengine:javascriptengine:1.0.0-rc01"

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
