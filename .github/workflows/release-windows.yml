name: Release from CI (Windows build, notes, checksums)

# The other half of a release, run on GitHub's runners instead of the
# maintainer's Windows machine -- for a release cut from somewhere that cannot
# build Windows or has no `gh` (a cloud session). It does what
# scripts/release.mjs does after the tag is pushed: create or update the
# prerelease with its notes and "Alpha Release #N" title, build and upload the
# Windows installer and portable zip, wait for the macOS DMG from
# build-mac.yml, verify every asset against a hash taken where it was built,
# and publish SHA256SUMS.txt. See docs/release-protocol.md.
#
# DISPATCH ONLY, on purpose: a tag push already runs build-mac.yml, and the
# ordinary `npm run release` uploads its own locally built Windows files. If
# this also ran on every tag, two different builds of the same filenames
# would race to the release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. notes-v0.8.0); created at `target` if it does not exist yet"
        required: true
      target:
        description: "Commit to tag when the tag does not exist yet (blank = the tip of the dispatched ref)"
        required: false
        default: ""
      notes:
        description: "Release notes (markdown); becomes the release body verbatim"
        required: true

permissions:
  contents: write
  actions: write

jobs:
  # Creates the release (and, through it, the tag -- some environments cannot
  # push tags) with its notes and title, then starts the macOS build of that
  # tag. A tag made with this workflow's token triggers nothing by itself,
  # so build-mac.yml is dispatched explicitly, which the token is allowed to do.
  # The full cross-platform check on the commit being released, in this run:
  # nothing below creates a release or builds an installer until it passed
  # (CLAUDE.md, "Git workflow").
  #
  # Which commit that is: the tag's, when the tag already exists, otherwise
  # the one `prepare` will create it at.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: sha
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target || github.sha }}
        run: |
          git fetch --tags --quiet
          if SHA=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}"); then :; else SHA=$(git rev-parse "$TARGET^{commit}"); fi
          # The same rule scripts/release.mjs keeps by construction: the tag
          # names the version that commit carries, and that version has its
          # changelog entry. Here the bump commit was written by hand, so check.
          VERSION=$(git show "$SHA:apps/notes/package.json" | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          if [ "$TAG" != "notes-v$VERSION" ]; then
            echo "::error::tag $TAG does not match apps/notes/package.json's version $VERSION at ${SHA:0:7}; expected notes-v$VERSION"
            exit 1
          fi
          if ! git show "$SHA:apps/notes/CHANGELOG.md" | grep -qE "^## $(printf '%s' "$VERSION" | sed 's/\./\\./g')( |$)"; then
            echo "::error::apps/notes/CHANGELOG.md at ${SHA:0:7} has no '## $VERSION' entry"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  gate:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    # A called workflow's jobs may hold no permission its caller did not
    # grant here, or GitHub refuses the whole run before any job starts
    # (startup_failure). ci.yml's landing job asks for pull-requests: read;
    # it is skipped outside a push to main, but is validated all the same.
    permissions:
      contents: write
      pull-requests: read
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  prepare:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      dispatched_at: ${{ steps.mac.outputs.dispatched_at }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Create or update the prerelease
        env:
          NOTES: ${{ inputs.notes }}
          TARGET: ${{ inputs.target || github.sha }}
        run: |
          printf '%s\n' "$NOTES" > notes.md
          # Continue the "Alpha Release #N" numbering, ignoring this tag's own
          # release (build-mac may already have created one titled by tag).
          NEXT=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json name,tagName \
            --jq "[.[] | select(.tagName != \"$TAG\" and (.tagName | test(\"^(notes-)?v[0-9]\"))) | .name | capture(\"Alpha Release #(?<n>[0-9]+)\") | .n | tonumber] | (max // 0) + 1")
          TITLE="Alpha Release #$NEXT"
          echo "title: $TITLE"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file notes.md --prerelease
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease --title "$TITLE" --notes-file notes.md --target "$TARGET"
          fi

      - name: Start the macOS build of the tag
        id: mac
        run: |
          echo "dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          gh workflow run build-mac.yml -R "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}" -f tag="$TAG"

  windows:
    needs: prepare
    runs-on: windows-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The test suite runs on the mac build of the same tag; running it here
      # too would only add a second chance for an environment difference to
      # hold the release back without saying anything about the code.
      - name: Build Windows installer and portable zip
        # Spelled out rather than `npm run build`, because an argument appended
        # to that reaches only its last command, and `--publish never` has to
        # reach both builder runs (see build-mac.yml for why it matters).
        working-directory: apps/notes
        run: |
          npx tsc
          npx vite build
          npx electron-builder --win --publish never
          npx electron-builder --config electron-builder.portable.json5 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Hash and upload the Windows artifacts
        id: hash
        run: |
          VERSION=$(node -p "require('./apps/notes/package.json').version")
          mapfile -t FILES < <(find "apps/notes/release/$VERSION" -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' \))
          if [ "${#FILES[@]}" -lt 2 ]; then echo "expected an .exe and a .zip, found: ${FILES[*]}"; exit 1; fi
          # GitHub rewrites spaces in asset names to dots; key on that form.
          HASHES=""
          for f in "${FILES[@]}"; do
            h=$(sha256sum "$f" | awk '{print $1}')
            name=$(basename "$f" | sed 's/ /./g')
            HASHES="$HASHES$h  $name;"
            echo "$h  $name"
          done
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"
          gh release upload "$TAG" "${FILES[@]}" --clobber

  checksums:
    needs: [prepare, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
      WINDOWS_HASHES: ${{ needs.windows.outputs.hashes }}
    steps:
      - name: Wait for the macOS build of this tag
        env:
          SINCE: ${{ needs.prepare.outputs.dispatched_at }}
        run: |
          # The run prepare dispatched: the first build-mac dispatch at or after
          # that moment. Created within seconds, so a short bounded look.
          RUN_ID=""
          for attempt in 1 2 3 4 5 6; do
            RUN_ID=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build-mac.yml --event workflow_dispatch --limit 20 \
              --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$SINCE\")] | sort_by(.createdAt) | .[0].databaseId // empty")
            [ -n "$RUN_ID" ] && break
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            echo "::warning::no build-mac run found for $TAG -- the DMG will be missing"
            exit 0
          fi
          gh run watch -R "$GITHUB_REPOSITORY" "$RUN_ID" --exit-status || echo "::warning::build-mac for $TAG did not succeed"

      - name: Verify every asset and publish SHA256SUMS.txt
        run: |
          set -euo pipefail
          declare -A LOCAL
          IFS=';' read -ra PAIRS <<< "$WINDOWS_HASHES"
          for pair in "${PAIRS[@]}"; do
            [ -z "$pair" ] && continue
            LOCAL["${pair#*  }"]="${pair%%  *}"
          done
          mkdir -p verify
          if gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern '*.dmg.sha256' --dir verify 2>/dev/null; then
            for f in verify/*.sha256; do
              line=$(tr -d '\r' < "$f")
              # "<hash>  <filename with spaces>": split on the first run of spaces only.
              h="${line%% *}"; name="$(echo "${line#* }" | sed 's/^ *//; s/ /./g')"
              LOCAL["$name"]="$h"
            done
          else
            echo "::warning::no DMG checksum sidecar on the release"
          fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select((.name | endswith(".sha256")) or .name == "SHA256SUMS.txt" | not) | "\(.digest // "")  \(.name)"' > remote.txt
          : > SHA256SUMS.txt
          FAIL=0
          while read -r digest name; do
            remote="${digest#sha256:}"
            if [ -z "$remote" ]; then echo "::warning::$name has no digest"; continue; fi
            echo "$remote  $name" >> SHA256SUMS.txt
            local_hash="${LOCAL[$name]:-}"
            if [ -z "$local_hash" ]; then echo "--  $name (no build-side hash)"; continue; fi
            if [ "$local_hash" = "$remote" ]; then echo "ok  $name"; else echo "::error::$name: built $local_hash != GitHub $remote"; FAIL=1; fi
          done < remote.txt
          [ "$FAIL" = 0 ] || { echo "checksum verification failed -- not publishing SHA256SUMS.txt"; exit 1; }
          sort -k2 -o SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" SHA256SUMS.txt --clobber
