# Builds the mobile soundscape app as an Android App Bundle (.aab) for the
# Google Play Store, signed with the Play UPLOAD key. Run by hand from the
# Actions tab when a version is ready; download the artifact, unzip it, and
# upload the .aab in the Play Console (apps/soundscapes/README.md, "Google Play").
#
# The version is apps/soundscapes/package.json's, and the versionCode is derived from it
# in apps/soundscapes/android/app/build.gradle, so a bundle is reproducible from its
# commit. Play requires every upload's versionCode to be higher than the last,
# so bump that version before releasing again.
name: Release Android App Bundle

on:
  workflow_dispatch:

jobs:
  # The full cross-platform check on this exact commit, in this run: a bundle
  # is built only once it passed (CLAUDE.md, "Git workflow").
  gate:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: write

  release-android:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web app and sync it into the Android project
        run: npm run build -w thockdown-soundscapes

      - name: Build the release bundle, signed with the upload key
        working-directory: apps/soundscapes/android
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          # An unsigned bundle cannot be uploaded: fail rather than produce one.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$PLAY_UPLOAD_KEYSTORE_PASSWORD" ]; then
            echo "::error::PLAY_UPLOAD_KEYSTORE_BASE64 and PLAY_UPLOAD_KEYSTORE_PASSWORD secrets are required"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          PLAY_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.p12" ./gradlew bundleRelease --no-daemon

      - name: Read the version
        id: version
        run: echo "name=$(node -p "require('./apps/soundscapes/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: thockdown-soundscapes-${{ steps.version.outputs.name }}-aab
          path: apps/soundscapes/android/app/build/outputs/bundle/release/app-release.aab
