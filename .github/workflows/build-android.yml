# Builds the mobile soundscape app (mobile/README.md) as a debug APK and
# uploads it as a workflow artifact, so it can be installed on a phone
# without Android Studio. Run by hand from the Actions tab, or on any push
# that touches what goes into it.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - "src/shared/soundscape*.ts"
      - "src/sound/SoundscapeEngine.ts"
      - "src/sound/audioOutputBus.ts"
      - "src/sidebar/SoundscapeOptions.tsx"
      - "public/soundscape-generator.js"
      - "capacitor.config.ts"
      - ".github/workflows/build-android.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Scripts are skipped: they build Electron's native modules, which the
      # mobile app does not use.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web app and sync it into the Android project
        run: npm run mobile:build

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: thockdown-soundscapes-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
