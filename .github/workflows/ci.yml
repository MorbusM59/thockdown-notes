# Every push and pull request: `npm run verify` (scripts/verify.mjs, the one
# definition of green: types, lint, tests and the web builds of every app),
# then the Android debug APK, which needs the Android SDK and so cannot be
# part of verify. Every app is built on every change, with no path filter:
# the mobile app shares much of src/ with the desktop, and a hand-kept list
# of which paths reach it drifted once already.
#
# Releases call this workflow (workflow_call) on the exact commit they ship,
# as a job their own jobs need, so nothing public-facing is built from a
# commit whose full check did not pass in that same run.
#
# A push to main also checks HOW the change arrived: a high-impact change
# (scripts/impact.mjs) must come through a pull request, and one pushed
# directly turns the run red, so it is seen and reviewed after the fact.
#
# A push build of main ALSO replaces the APK on the `android-latest` prerelease,
# only after verify passed, so a change that breaks a test never reaches the
# installable APK. A workflow artifact always downloads as a zip, which a
# phone cannot install from, so the release asset is the plain .apk at a fixed
# address. The tag does not start with `v`, so it does not trigger
# build-mac.yml, and its title does not match "Alpha Release #N", so
# release-windows.yml's numbering ignores it.
name: CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit to check (blank = the caller's commit)"
        type: string
        default: ""
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an older run's answer moot. Never
# cancel main mid-publish, though: each main run finishes in order.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

  android:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Scripts are skipped: they build Electron's native modules, which the
      # mobile app does not use.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web app and sync it into the Android project
        run: npm run mobile:build

      - name: Build debug APK, signed with the app's one key
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SOUNDSCAPES_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Without the key every build is signed differently and the phone
          # refuses it as an update: fail rather than publish that.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$SOUNDSCAPES_KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets are required"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/soundscapes.p12"
          SOUNDSCAPES_KEYSTORE="$RUNNER_TEMP/soundscapes.p12" ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: thockdown-soundscapes-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to the android-latest prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk thockdown-soundscapes.apk
          # Move the tag to this commit, so the release says what it was built from.
          git tag -f android-latest
          git push -f origin refs/tags/android-latest
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest thockdown-soundscapes.apk --clobber
          else
            gh release create android-latest thockdown-soundscapes.apk --prerelease \
              --title "Android soundscapes (latest build)" \
              --notes "Debug build of the mobile soundscape app from the latest main. Replaced on every build; see mobile/README.md."
          fi

  # A high-impact change must reach main through a pull request. This cannot
  # stop a direct push (GitHub protects a branch for every change or none),
  # so it reports one: the run goes red and names the paths.
  landing:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: High-impact changes came through a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # A new branch or a force push has no usable "before": check the head commit alone.
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then BEFORE="$AFTER~1"; fi
          if HITS=$(node scripts/impact.mjs "$BEFORE" "$AFTER"); then
            echo "low impact"; exit 0
          fi
          PRS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$AFTER/pulls" --jq 'map(select(.merged_at != null)) | length')
          if [ "$PRS" -gt 0 ]; then
            echo "high impact, merged through a pull request"; exit 0
          fi
          echo "::error::High-impact change pushed to main without a pull request (see CLAUDE.md, Git workflow):"
          echo "$HITS"
          exit 1
