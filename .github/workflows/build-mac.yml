name: Build macOS DMG

# Half of the release protocol. The other half runs on the maintainer's Windows
# machine (`npm run release`, scripts/release.mjs) -- see docs/release-protocol.md.
#
# This job's only job: build the macOS DMG that a Windows machine physically
# cannot build, and attach it to the release for the pushed tag.

on:
  # Manual re-runs matter more than they look: a tag's workflow file is frozen
  # at the tagged commit, so a broken pipeline can't be re-run against its own
  # tag. Dispatching from main runs the *current* workflow, while `tag` selects
  # which source to check out and which release to attach to -- i.e. "rebuild
  # the DMG for v0.5.8 with the fixed pipeline".
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (blank = just build this ref)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

# Without this the job's GITHUB_TOKEN is read-only (the repo default), and the
# upload fails with "Resource not accessible by integration" *after* a
# successful 3-minute build. That is exactly what happened on v0.5.7, and it is
# why no release before v0.5.8 ever carried a macOS build.
permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    env:
      # The release this run belongs to: the pushed tag, or the dispatch input.
      # Empty means "build only, attach to nothing".
      TARGET_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # Build the tagged source even when dispatched from another ref, so
          # the DMG always corresponds to the commit the release points at.
          ref: ${{ inputs.tag || github.ref }}
          # Full history so release-note tooling and `git describe` work here.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Read version
        id: version
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Only the mac target. `npm run build` also runs the Windows portable
      # config, which on a mac runner just produces a second, redundant DMG and
      # makes the artifact glob ambiguous.
      # `--publish never` is load-bearing. electron-builder sees a tag in the
      # environment, decides on its own that artifacts "will be published",
      # and fails the build demanding GH_TOKEN -- after the DMG is already
      # sitting on disk. Uploading is this workflow's job, not the builder's.
      - name: Build macOS DMG
        run: |
          npx tsc
          npx vite build
          npx electron-builder --mac dmg --publish never

      - name: Checksum the DMG
        id: dmg
        run: |
          DMG=$(find release -maxdepth 3 -name "*.dmg" | head -n 1)
          if [ -z "$DMG" ]; then echo "No DMG produced"; exit 1; fi
          HASH=$(shasum -a 256 "$DMG" | awk '{print $1}')
          printf '%s  %s\n' "$HASH" "$(basename "$DMG")" > "$DMG.sha256"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          cat "$DMG.sha256"

      # Uploaded unconditionally, so even a failed publish leaves a downloadable
      # build rather than three minutes of nothing.
      - name: Upload DMG as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thockdown-Notes-mac-${{ steps.version.outputs.version }}-dmg
          path: |
            release/**/*.dmg
            release/**/*.dmg.sha256

      # The release is normally created first by `npm run release` on the
      # maintainer's machine, with hand-written notes. Creating it here is the
      # fallback for a bare `git push --tags` or a manual dispatch.
      - name: Attach DMG to the release
        if: env.TARGET_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          if ! gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            echo "No release for $TARGET_TAG yet -- creating one."
            gh release create "$TARGET_TAG" --prerelease --title "$TARGET_TAG" \
              --notes "Automated build for $TARGET_TAG."
          fi
          gh release upload "$TARGET_TAG" "$DMG" "$DMG.sha256" --clobber
